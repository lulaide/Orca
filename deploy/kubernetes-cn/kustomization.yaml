# 国内部署版 — 使用阿里云 ACR 镜像源。
# kubectl apply -k deploy/kubernetes-cn/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../kubernetes

images:
  - name: orca:latest
    newName: registry.cn-hangzhou.aliyuncs.com/orca-ops-agent/orca
    newTag: latest
  - name: postgres:16-alpine
    newName: registry.cn-hangzhou.aliyuncs.com/orca-ops-agent/postgres
    newTag: 16-alpine
