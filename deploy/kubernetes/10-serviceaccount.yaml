# Orca Agent 的身份。Deployment 通过 serviceAccountName 引用它，
# kubelet 会自动把对应 token 挂载到 Pod 的
# /var/run/secrets/kubernetes.io/serviceaccount/ 目录，
# client-go 的 rest.InClusterConfig() 自动读取。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orca
  namespace: orca-system
  labels:
    app.kubernetes.io/name: orca
