# Orca 运行时非敏感配置。
# LLM 配置留空 — 部署后在 Web Settings 页面配置。
# 敏感字段（DB 密码等）在 05-secret.yaml 里。
apiVersion: v1
kind: ConfigMap
metadata:
  name: orca-config
  namespace: orca-system
  labels:
    app.kubernetes.io/name: orca
data:
  # PostgreSQL 连接（指向集群内 StatefulSet Service）
  db_host: "postgres.orca-system.svc"
  db_port: "5432"
  db_name: "orca"
  db_user: "orca"

  # HTTP 服务器监听端口
  http_port: "8080"
