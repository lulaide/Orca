# 只读权限：诊断用，不含 secrets。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orca-readonly
  labels:
    app.kubernetes.io/name: orca
rules:
  # 核心资源
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - nodes/status
      - services
      - endpoints
      - configmaps
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # 工作负载
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  # 网络
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # 批处理
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # 指标（如果集群装了 metrics-server，用来做资源使用率检查）
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]

---
# 写操作权限：通过应用层审批流控制，覆盖所有写工具所需的 K8s API 权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orca-operator
  labels:
    app.kubernetes.io/name: orca
rules:
  # scale_deployment: 需要 deployments/scale 子资源
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
    verbs: ["get", "update", "patch"]

  # restart_deployment / rollback_deployment: 需要 patch deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "patch", "update"]

  # delete_pod: 需要 delete pods
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete"]

  # cordon/uncordon: 需要 patch nodes
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "patch", "update"]
