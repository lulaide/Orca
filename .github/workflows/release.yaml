# 打 tag 时自动创建 GitHub Release + 生成 changelog。
# 使用 release-please（Google 出品），根据 Conventional Commits 自动：
#   1. 维护一个 Release PR（累积 feat/fix/... 提交）
#   2. PR 合并后打 tag + 创建 GitHub Release + 生成 changelog
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go
          package-name: orca
          # 中文 changelog section 标题
          changelog-sections: >-
            [
              {"type":"feat","section":"新功能"},
              {"type":"fix","section":"修复"},
              {"type":"perf","section":"性能优化"},
              {"type":"refactor","section":"重构"},
              {"type":"ci","section":"CI/CD"},
              {"type":"docs","section":"文档"},
              {"type":"chore","section":"杂项"}
            ]
